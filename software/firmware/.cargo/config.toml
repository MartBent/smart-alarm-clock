[build]
target = "xtensa-esp32s3-espidf"

[target.xtensa-esp32s3-espidf]
linker = "ldproxy"
runner = "espflash flash --monitor --partition-table partitions.csv" # `cargo run` builds, flashes over USB-C, opens the monitor (custom 3 MB app partition — the debug build exceeds the default 1 MB)
rustflags = ["--cfg", "espidf_time64"] # esp-idf uses 64-bit time_t

[unstable]
build-std = ["std", "panic_abort"]

[env]
# Pin the ESP-IDF version esp-idf-sys downloads + builds against.
ESP_IDF_VERSION = "v5.2.3"
# NOTE: the "main;pthread" component trim was removed — driving peripherals
# (RMT for the WS2812, and later I2C/SPI/LEDC/WiFi) needs the esp_driver_*
# components, which the trim excluded (caused undefined-symbol link errors).
# Build the full esp-idf for now; re-introduce a curated ESP_IDF_COMPONENTS
# list later if release binary size matters.
